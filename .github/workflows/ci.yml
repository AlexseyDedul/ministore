name: CI (Maven + JaCoCo + Sonar)

on:
  push: { branches: ['**'] }
  pull_request: { branches: [ main ] }
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

env:
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: temurin

jobs:
  build-and-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Docker sanity check
        run: |
          docker --version
          docker info

      - name: Pre-pull common images
        run: |
          docker pull postgres:16 || true
          docker pull mongo:7 || true
          docker pull rabbitmq:3-management || true

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Прогон unit + IT (failsafe)
      - name: Build & Test (aggregate coverage)
        run: |
          mvn -B -ntp clean verify \
            -DwithDocker=${{ env.withDocker }} \
            -Deureka.client.enabled=false \
            -Dspring.cloud.discovery.enabled=false

      # Sonar для push (ветки)
      - name: Sonar analysis (branch)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp sonar:sonar \
            -Dsonar.branch.name="${GITHUB_REF_NAME}"

      # Sonar для PR
      - name: Sonar analysis (PR)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp sonar:sonar \
            -Dsonar.pullrequest.base="${{ github.base_ref }}" \
            -Dsonar.pullrequest.branch="${{ github.head_ref }}" \
            -Dsonar.pullrequest.key="${{ github.event.pull_request.number }}"

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-jacoco
          path: |
            **/target/surefire-reports/**
            target/site/jacoco-aggregate/**
            **/target/site/jacoco/**
