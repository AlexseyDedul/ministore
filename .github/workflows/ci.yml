name: CI (Maven + JaCoCo + Sonar)

on:
  push: { branches: ['**'] }
  pull_request: { branches: [ main ] }
  workflow_dispatch: {}

concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: temurin

jobs:
  build-and-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Docker sanity check
        run: |
          docker --version
          docker info

      - name: Pre-pull common images
        run: |
          docker pull postgres:16 || true
          docker pull mongo:7 || true

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Прогон unit + IT (failsafe)
      - name: Build & Test (aggregate coverage)
        run: |
          mvn -B -ntp clean verify \
            -DwithDocker=${{ env.withDocker }} \
            -Deureka.client.enabled=false \
            -Dspring.cloud.discovery.enabled=false

      # Sonar для push (ветки)
      - name: Start SonarQube (Docker)
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:lts-community

      - name: Wait for SonarQube to be up
        run: |
          set -euo pipefail
          for _ in {1..60}; do 
          STATUS="$(curl -fsS http://localhost:9000/api/system/status \
          | grep -o '"status":"[^"]*"' \
          | cut -d: -f2 \
          | tr -d '"' || true)" 
          echo "SonarQube status: ${STATUS:-unknown}"
          if [ "${STATUS:-}" = "UP" ]; then
          break
          fi
          sleep 5
          done

      - name: Generate Sonar token
        id: sonar_token
        run: |
          TOKEN_JSON=$(curl -sS -u admin:admin -X POST \
            'http://localhost:9000/api/user_tokens/generate' \
            -d name=ci -d type=GLOBAL_ANALYSIS_TOKEN)
          TOKEN=$(echo "$TOKEN_JSON" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then echo "Failed to get token"; exit 1; fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Sonar analysis (Community; only main)
        if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}
        run: |
          mvn -B -ntp sonar:sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.projectKey=ministore-parent \
            -Dsonar.projectName=ministore-parent

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-jacoco
          path: |
            **/target/surefire-reports/**
            target/site/jacoco-aggregate/**
            **/target/site/jacoco/**
      - name: Cleanup Docker
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f
          docker system prune -af || true